name: Run Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install
        run: pip install requests

      - name: Run agent
        run: python agent.py

      - name: Save cache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sent_matches.json || true
          git commit -m "update cache" || true
          git push
